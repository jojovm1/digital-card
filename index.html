<style>
body{
    margin:0;
    background:#eef5f2;
    font-family: "Segoe UI", Arial, sans-serif;
    color:#1f2933;
}
.container{
    max-width:420px;
    margin:20px auto;
    padding:15px;
}
.profile-card{
    background:#ffffff;
    border-radius:14px;
    padding:16px;
    display:flex;
    gap:15px;
    align-items:center;
    box-shadow:0 6px 18px rgba(11,79,108,.08);
    border-left:5px solid #0b4f6c;
}
.profile-card img{
    width:82px;
    height:82px;
    border-radius:12px;
    object-fit:cover;
}
.name{
    font-size:18px;
    font-weight:700;
    color:#0b4f6c;
}
.designation{
    font-size:14px;
    color:#4b5563;
}
.save-btn{
    margin:18px 0;
    background:#0b4f6c;
    color:#ffffff;
    text-align:center;
    padding:14px;
    border-radius:10px;
    text-decoration:none;
    font-weight:600;
    display:block;
    letter-spacing:.3px;
}
.save-btn:hover{
    background:#08384e;
}
.section-title{
    margin:22px 0 10px;
    font-weight:700;
    color:#0b4f6c;
}
.about{
    font-size:14px;
    color:#374151;
    line-height:1.65;
}
.info-box{
    background:#ffffff;
    border-radius:12px;
    padding:13px;
    margin:12px 0;
    display:flex;
    gap:12px;
    align-items:center;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}
.icon{
    width:38px;
    height:38px;
    background:#5fa8a3;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffffff;
    font-size:18px;
}
.info-text{
    font-size:14px;
    color:#1f2933;
    word-break:break-word;
}
a{
    color:inherit;
    text-decoration:none;
}
</style>
